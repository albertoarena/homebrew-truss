# The checks AGENTS.md asks for before a formula change is pushed, run by CI
# so they hold for every pull request and for every push to main. The release
# workflow in laravel-truss pushes its bump straight to main, so the push
# trigger is what catches a bump that breaks the install.
name: formula

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  formula:
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-26 ]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      contents: read
    steps:
      # Checks this repository out as the albertoarena/truss tap.
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - run: brew trust albertoarena/truss

      - run: brew audit --strict --online albertoarena/truss/truss

      # PHP is a test dependency only, so the plain install pulls none in and
      # the test needs it asked for.
      - run: brew install --include-test albertoarena/truss/truss

      - run: brew test --verbose albertoarena/truss/truss
